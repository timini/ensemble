name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run the full free-mode E2E suite (paid calls to every provider) after deploy'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # Run existing CI checks first
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci]
    # Only deploy if CI passed - never deploy if CI was skipped or failed
    if: |
      always() &&
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build consensus packages
        run: |
          npm run build --workspace=packages/consensus-core
          npm run build --workspace=packages/consensus-standard
          npm run build --workspace=packages/consensus-elo
          npm run build --workspace=packages/consensus-majority
          npm run build --workspace=packages/consensus-council

      - name: Build shared-utils
        run: npm run build --workspace=packages/shared-utils

      - name: Build app
        run: npm run build --workspace=packages/app
        env:
          SKIP_ENV_VALIDATION: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      # NOTE: Firebase App Hosting auto-deploys when we push to main.
      # Manual rollout via CLI requires complex Developer Connect permissions.
      # If you need manual rollouts, grant the deploy service account access to
      # the Developer Connect connection resource (not just project-level IAM).
      #
      # For now, we wait for Firebase's automatic deployment to complete.
      - name: Wait for Firebase Auto-Deployment
        run: |
          echo "Waiting for Firebase App Hosting to auto-deploy from main branch..."
          echo "Firebase automatically deploys when it detects push to main."
          # Give Firebase time to detect the push and start building
          sleep 60

      - name: Verify deployment
        run: |
          set -euo pipefail

          PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"
          BACKEND_ID="ensemble-app"
          TARGET_SHA="${GITHUB_SHA}"
          DEPLOY_URL="https://ensemble-app--${{ vars.FIREBASE_PROJECT_ID }}.us-central1.hosted.app"
          API_BASE="https://firebaseapphosting.googleapis.com/v1beta/projects/${PROJECT_ID}/locations/us-central1/backends/${BACKEND_ID}"

          echo "Waiting for Firebase App Hosting rollout for commit ${TARGET_SHA}..."
          for i in {1..20}; do
            ACCESS_TOKEN="$(gcloud auth print-access-token)"
            ROLLOUTS_JSON="$(curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" "${API_BASE}/rollouts?pageSize=200")"

            if [[ "$(echo "${ROLLOUTS_JSON}" | jq -r '(.rollouts // []) | length')" == "0" ]]; then
              echo "Attempt ${i}/20: no rollouts found; waiting 30s..."
              sleep 30
              continue
            fi

            MATCH_FOUND="false"
            MATCH_ROLLOUT_STATE=""
            MATCH_BUILD_STATE=""
            MATCH_BUILD_ERROR=""
            MATCH_ROLLOUT_NAME=""

            while IFS= read -r ROLLOUT_JSON; do
              BUILD_RESOURCE="$(echo "${ROLLOUT_JSON}" | jq -r '.build // empty')"
              if [[ -z "${BUILD_RESOURCE}" ]]; then
                continue
              fi

              BUILD_JSON="$(curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://firebaseapphosting.googleapis.com/v1beta/${BUILD_RESOURCE}")"
              BUILD_SHA="$(echo "${BUILD_JSON}" | jq -r '.source.codebase.hash // empty')"
              if [[ "${BUILD_SHA}" != "${TARGET_SHA}" ]]; then
                continue
              fi

              MATCH_FOUND="true"
              MATCH_ROLLOUT_NAME="$(echo "${ROLLOUT_JSON}" | jq -r '.name')"
              MATCH_ROLLOUT_STATE="$(echo "${ROLLOUT_JSON}" | jq -r '.state')"
              MATCH_BUILD_STATE="$(echo "${BUILD_JSON}" | jq -r '.state // empty')"
              MATCH_BUILD_ERROR="$(echo "${BUILD_JSON}" | jq -r '.error.message // empty')"
              break
            done < <(echo "${ROLLOUTS_JSON}" | jq -c '(.rollouts // []) | sort_by(.createTime) | reverse | .[]')

            if [[ "${MATCH_FOUND}" == "false" ]]; then
              echo "Attempt ${i}/20: no rollout found yet for commit ${TARGET_SHA}; waiting 30s..."
              sleep 30
              continue
            fi

            echo "Attempt ${i}/20: rollout=${MATCH_ROLLOUT_NAME} rolloutState=${MATCH_ROLLOUT_STATE} buildState=${MATCH_BUILD_STATE} commit=${TARGET_SHA}"

            if [[ "${MATCH_ROLLOUT_STATE}" == "FAILED" || "${MATCH_BUILD_STATE}" == "FAILED" ]]; then
              echo "Firebase App Hosting rollout failed for commit ${TARGET_SHA}."
              if [[ -n "${MATCH_BUILD_ERROR}" ]]; then
                echo "Build error: ${MATCH_BUILD_ERROR}"
              fi
              exit 1
            fi

            if [[ "${MATCH_ROLLOUT_STATE}" == "SUCCEEDED" ]]; then
              echo "Rollout succeeded for commit ${TARGET_SHA}. Verifying deployed URL..."
              if curl -sf --max-time 10 "${DEPLOY_URL}" > /dev/null 2>&1; then
                echo "Deployment verified successfully!"
                exit 0
              fi
              echo "Rollout succeeded but URL check failed. Waiting 30s..."
              sleep 30
              continue
            fi

            echo "Rollout still in progress; waiting 30s..."
            sleep 30
          done

          echo "Timed out waiting for Firebase App Hosting rollout for commit ${TARGET_SHA}."
          exit 1

      - name: Output deployment URL
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: https://ensemble-app--${{ vars.FIREBASE_PROJECT_ID }}.us-central1.hosted.app" >> $GITHUB_STEP_SUMMARY

    outputs:
      deploy_url: https://ensemble-app--${{ vars.FIREBASE_PROJECT_ID }}.us-central1.hosted.app

  # Free check that the deployed app answers. No provider calls.
  smoke-check:
    name: HTTP Smoke Check - Post Deploy
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' }}

    steps:
      - name: Check deployed pages respond
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          # minInstances is 0, so the first request may wait for a cold start.
          # -L follows the / redirect, so this keeps working once / becomes a page.
          for path in / /workspace; do
            status="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 \
              --retry 5 --retry-delay 10 --retry-all-errors "${DEPLOY_URL}${path}")"
            echo "GET ${path} -> ${status}"
            if [[ "${status}" != "200" ]]; then
              echo "::error::Expected 200 from ${DEPLOY_URL}${path}, got ${status}"
              exit 1
            fi
          done
          # The old wizard route is a server redirect into the settings panel.
          check_redirect() {
            local path="$1" expected="$2" out status location
            out="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 60 \
              --retry 5 --retry-delay 10 --retry-all-errors "${DEPLOY_URL}${path}")"
            status="${out%% *}"
            location="${out#* }"
            echo "GET ${path} -> ${status} ${location}"
            if [[ "${status}" != "307" && "${status}" != "308" ]]; then
              echo "::error::Expected a redirect from ${DEPLOY_URL}${path}, got ${status}"
              exit 1
            fi
            if [[ "${location}" != *"${expected}" ]]; then
              echo "::error::Expected ${DEPLOY_URL}${path} to redirect to ${expected}, got ${location}"
              exit 1
            fi
          }
          check_redirect /config '/workspace?panel=settings'

  # Post-deploy E2E against the deployed URL. By default this is one cheap
  # real-provider test (google-only spec: two short Gemini calls) and only runs
  # when TEST_GOOGLE_API_KEY is set. The full free-mode suite calls every
  # provider, so it only runs on a manual dispatch with full_e2e enabled.
  e2e-post-deploy:
    name: E2E (${{ inputs.full_e2e && 'Free Mode, full' || 'Google smoke' }}) - Post Deploy
    runs-on: ubuntu-latest
    needs: [deploy, smoke-check]
    if: ${{ needs.deploy.result == 'success' && needs.smoke-check.result == 'success' }}
    env:
      FULL_E2E: ${{ inputs.full_e2e && 'true' || 'false' }}
      TEST_GOOGLE_API_KEY: ${{ secrets.TEST_GOOGLE_API_KEY }}

    steps:
      - name: Check provider key is configured
        id: check-keys
        run: |
          if [[ "${FULL_E2E}" == "true" || -n "${TEST_GOOGLE_API_KEY}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TEST_GOOGLE_API_KEY is not set. Skipping post-deploy provider smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-keys.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-keys.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        if: steps.check-keys.outputs.run == 'true'
        run: npm ci

      - name: Get Playwright version
        if: steps.check-keys.outputs.run == 'true'
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
        working-directory: packages/e2e
      - name: Cache Playwright browsers
        if: steps.check-keys.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.check-keys.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      - name: Install Playwright system deps
        if: steps.check-keys.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/e2e

      # One test, no retries, so a merge costs at most one pass of two Gemini calls.
      - name: Run Google smoke test against deployed app
        if: steps.check-keys.outputs.run == 'true' && env.FULL_E2E != 'true'
        run: npm run test:free --workspace=packages/e2e -- google-only.spec.ts --retries=0
        env:
          E2E_MODE: "free"
          E2E_BASE_URL: ${{ needs.deploy.outputs.deploy_url }}
          NEXT_PUBLIC_MOCK_MODE: "false"

      - name: Run full Free Mode E2E suite against deployed app
        if: steps.check-keys.outputs.run == 'true' && env.FULL_E2E == 'true'
        run: npm run test:free --workspace=packages/e2e
        env:
          E2E_MODE: "free"
          E2E_BASE_URL: ${{ needs.deploy.outputs.deploy_url }}
          NEXT_PUBLIC_MOCK_MODE: "false"
          TEST_OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          TEST_XAI_API_KEY: ${{ secrets.TEST_XAI_API_KEY }}
          TEST_PERPLEXITY_API_KEY: ${{ secrets.TEST_PERPLEXITY_API_KEY }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-post-deploy-results
          path: packages/e2e/test-results/
          retention-days: 7

  # Pro Mode E2E Tests - Placeholder for Phase 4
  # Will test backend services, authentication, and credits
  # e2e-pro-mode:
  #   name: E2E Tests (Pro Mode) - Post Deploy
  #   runs-on: ubuntu-latest
  #   needs: [deploy]
  #   if: ${{ needs.deploy.result == 'success' }}
  #   steps:
  #     - run: echo "Pro mode tests will be added in Phase 4"
