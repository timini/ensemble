# Firebase App Hosting configuration for Ensemble AI
# https://firebase.google.com/docs/app-hosting/configure

# Monorepo setup: backend rootDirectory is "packages/app" (set via Firebase API).
# A symlink packages/app/package-lock.json -> ../../package-lock.json ensures
# the buildpack finds the workspace root lockfile.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 3
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME

  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability:
      - BUILD

  - variable: SKIP_ENV_VALIDATION
    value: "true"
    availability:
      - BUILD

  # Enable Sentry in Firebase App Hosting rollouts.
  # Secret names are resolved in Google Secret Manager.
  - variable: NEXT_PUBLIC_SENTRY_DSN
    secret: NEXT_PUBLIC_SENTRY_DSN
    availability:
      - BUILD
      - RUNTIME

  # Firebase Auth web config (public values, inlined into the client
  # bundle at build time). Stored as secrets only so the values live in
  # one place; create them with `firebase apphosting:secrets:set`.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # Stripe keys, server only. Test-mode keys until launch.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Credit pricing (not secret). See docs/DEPLOYMENT.md.
  - variable: CREDIT_MARGIN_PERCENT
    value: "30"
    availability:
      - RUNTIME

  - variable: CREDIT_LOW_BALANCE_USD
    value: "1"
    availability:
      - RUNTIME

  - variable: CREDIT_PACKS_USD
    value: "5,20,50"
    availability:
      - RUNTIME
